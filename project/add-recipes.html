<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WDD 131 - Add Recipes for way2yummy.com</title>
    <meta name="description"
        content="This site contains a form which allows people to add their favorite yummy recipes to way2yummy.com.">
    <meta name="author" content="Paul A. Scherbel">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Baskervville:ital,wght@0,400..700;1,400..700&family=Pacifico&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" type="text/css" href="./styles/add-recipes.css">
    <script src="./scripts/add-recipes.js" defer></script>
    <link rel="icon" type="image/png" href="rainbow-compass.ico">
</head>
<body>
    <header>
        <a href="index.html">
            <figure>
                <img src="./images/recipe-card.webp" alt="Stylized recipe card">
                <figcaption>Click to return to the Home page.</figcaption>
            </figure>
        </a>

        <a href="view-recipes.html">
            <figure>
                <img src="./images/add-button-up.webp" alt="Stylized button to view recipes added to way2yummy.com">
                <figcaption>Click to return to view more yummy recipes.</figcaption>
            </figure>
        </a>
        <div class="button">
            <img src="./images/add-button-up.webp" alt="stylized button for adding recipes" width="256">
        </div>

        <div>
            <h1>way2yummy.com</h1>
        </div>

    </header>

    <main>
        <form method="get" action="review.html" class="wf1">
            <fieldset>
                <div class="name">
                    <label for="name-input">What <span class="my-url">yummy</span>  thing are we adding?</label>
                    <input type="text" id="name-input" name="name">
                </div>

                <div>
                    <label for="image-upload">Select an image you have on file or take a photo:</label>
                    <input type="file" id="image-upload" accept="image/*" capture="user">
                    <img id="image-preview" src="#" alt="Image preview" style="max-width: 300px; max-height: 300px; display: none;">
                </div>

                <div class="features">
                    <p>What catagory or catagories would your recipe fit in best? <br><span class="italics">(Click all that
                            apply)</span></p>
                </div>
                
                <div class="checkbox">
                    <div class="checkbox-align">
                        <input type="checkbox" id="lunch-checkbox" name="lunch" value="yes">
                        <label for="lunch-checkbox">Lunch</label>
                    </div>

                    <div class="checkbox-align">
                        <input type="checkbox" id="dinner-checkbox" name="dinner" value="yes">
                        <label for="dinner-checkbox">Dinner</label>
                    </div>
                    
                    <div class="checkbox-align">
                        <input type="checkbox" id="dessert-checkbox" name="dessert" value="yes">
                        <label for="dessert-checkbox">Dessert</label>
                    </div>
                    
                    <div class="checkbox-align">    
                        <input type="checkbox" id="beverages-checkbox" name="beverages" value="yes">
                        <label for="beverage-checkbox">Beverages</label>
                    </div>

                    <div class="checkbox-align">
                        <input type="checkbox" id="snacks-checkbox" name="snacks" value="yes">
                        <label for="snack-checkbox">Snacks</label>
                    </div>
                
                </div>

                <div class="preptime">
                    <label for="preptime-input">Preparation Time:
                    </label>
                    <input type="text" id="preptime-input" name="preptime">
                </div>

                <div class="servings">
                    <label for="servings-input">Number of Servings:
                    </label>
                    <input type="number" id="servings-input" name="servings">
                </div>

                <div class="ingredients">
                    <label for="ingredients-text">Ingredients: </label>
                    <textarea id="ingredients-text" name="ingredients" placeholder="1 Cup Flour&#10;2 Cups Sugar, etc."></textarea>
                </div>

                <div class="directions">
                    <label for="directions-text">Directions: </label>
                    <textarea id="directions-text" name="directions" placeholder="Combine all dry ingredients..."></textarea>
                </div>

                <div class="bytheway">
                    <label for="bytheway-text">By the way... </label>
                    <textarea id="bytheway-text" name="bytheway" placeholder="In case you're wondering..."></textarea>
                </div>

                <div class="contributor">
                    <label for="contributor-input">Contributed by: <span class="italics">(Your Name)
                        </span></label>
                    <input type="text" id="contributor-input" name="contributor">
                </div>

                <input type="submit" value="Add your YUMMY recipe">
            </fieldset>
        
        </form>

    </main>
</body>
</html>
