<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>way2yummy.com – Share a Recipe</title>

    <!-- GOOGLE FONT (logo-style friendly script + readable body) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Nunito:wght@400;600;700&display=swap"
        rel="stylesheet">

    <style>
        /* =====================
BRAND VARIABLES
===================== */
        :root {
            --brand-green: #3f7d2a;
            --brand-orange: #f29b2f;
            --brand-cream: #fff7ec;
            --brand-light-green: #eaf4e4;
            --border: #cfe0c5;
            --text: #2f3a2c;
        }

        body {
            margin: 0;
            background: var(--brand-cream);
            font-family: "Nunito", system-ui, sans-serif;
            color: var(--text);
            /*background-image: url(recipe-card.webp);
            background-repeat: no-repeat;
            background-size:auto;*/
        }

        .card {
            max-width: 420px;
            margin: 0 auto;
            padding: 1rem;
        }

        header {
            text-align: center;
            margin-bottom: 1rem;
        }

        header h1 {
            font-family: "Pacifico", cursive;
            font-size: 2rem;
            margin: 0;
            color: var(--brand-green);
        }

        header p {
            margin: 0.25rem 0 0;
            font-size: 0.95rem;
        }

        form {
            background: #fff;
            border: 2px dashed var(--border);
            border-radius: 18px;
            padding: 1rem;
        }

        .field {
            margin-bottom: 1rem;
            background: transparent;
        }

        #ingredients {
            background-image: url(recipe-card-ingredients.webp);
            background-repeat: no-repeat;
            background-size: 100% 100%;
        }

        label {
            display: block;
            font-weight: 700;
            margin-bottom: 0.35rem;
            background: transparent;
        }

        input,
        select,
        textarea {
            width: 100%;
            box-sizing: border-box;
            padding: 0.7rem;
            border-radius: 12px;
            border: 1px solid var(--border);
            font-size: 1rem;
            font-family: inherit;
        }

        textarea {
            resize: none;
            overflow: hidden;
        }

        .large {
            min-height: 140px;
        }

        .row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.75rem;
        }

        .hint {
            font-size: 0.8rem;
            color: #6a7a66;
            margin-top: 0.25rem;
        }

        .icon {
            margin-right: 0.35rem;
        }

        button {
            width: 100%;
            padding: 0.9rem;
            border: none;
            border-radius: 16px;
            font-size: 1.1rem;
            font-weight: 700;
            color: #fff;
            background: linear-gradient(135deg, var(--brand-orange), #f6b45b);
            cursor: pointer;
        }

        button:disabled {
            opacity: 0.6;
        }

        /* Image preview */
        #preview {
            margin-top: 0.5rem;
            max-width: 100%;
            border-radius: 12px;
            display: none;
        }

        .error {
            color: #b03030;
            font-size: 0.85rem;
            margin-top: 0.25rem;
        }
    </style>
</head>

<body>
    <div class="card">
        <header>

            <h1><img src="./images/recipe-card-top.webp" alt="Recipe Card Design Header" width="512" height="289"></h1>
            <!--<p>Share your favorite recipe 🥑🍰</p>-->
        </header>

        <form id="recipeForm">
            <div class="field">
                <label>🍽️ What yummy thing are we making?</label>
                <input required name="title" placeholder="Recipe name" />
            </div>

            <div class="field">
                <label>📂 Category</label>
                <select name="category" required>
                    <option value="">Choose one</option>
                    <option>Breakfast</option>
                    <option>Lunch</option>
                    <option>Dinner</option>
                    <option>Dessert</option>
                    <option>Snack</option>
                </select>
            </div>

            <div class="row">
                <div class="field">
                    <label>⏱️ Preparation time</label>
                    <input name="prepTime" placeholder="30 minutes" />
                </div>

                <div class="field">
                    <label>🍽️ Servings</label>
                    <input type="number" min="1" name="servings" />
                </div>
            </div>

            <div class="field" id="ingredients">
                <label>🧂 Ingredients (one per line)</label>
                <textarea class="large auto-grow" name="ingredients"
                    placeholder="2 eggs&#10;1 avocado&#10;½ cup cream cheese"></textarea>
            </div>

            <div class="field">
                <label>📋 Directions</label>
                <textarea class="large auto-grow" name="directions"></textarea>
            </div>

            <div class="field">
                <label>💡 By the way</label>
                <textarea class="large auto-grow" name="notes"></textarea>
            </div>

            <div class="field">
                <label>❤️ Contributed by</label>
                <input name="contributor" />
            </div>

            <div class="field">
                <label>📸 Photo</label>
                <input type="file" accept="image/*" id="photoInput" />
                <img id="preview" />
            </div>

            <button type="submit">Submit Recipe</button>
            <div id="formError" class="error"></div>
        </form>
    </div>

    <script>
        /* =====================
        AUTO-GROW TEXTAREAS
        ===================== */
        document.querySelectorAll(".auto-grow").forEach(el => {
            el.addEventListener("input", () => {
                el.style.height = "auto";
                el.style.height = el.scrollHeight + "px";
            });
        });

        /* =====================
        IMAGE PREVIEW
        ===================== */
        const photoInput = document.getElementById("photoInput");
        const preview = document.getElementById("preview");

        photoInput.addEventListener("change", () => {
            const file = photoInput.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = e => {
                preview.src = e.target.result;
                preview.style.display = "block";
            };
            reader.readAsDataURL(file);
        });

        /* =====================
        FORM SUBMIT
        ===================== */
        document.getElementById("recipeForm").addEventListener("submit", async e => {
            e.preventDefault();

            const form = e.target;
            const error = document.getElementById("formError");

            // Parse ingredients into array
            const ingredients = form.ingredients.value
                .split("\n")
                .map(line => line.trim())
                .filter(Boolean);

            if (ingredients.length === 0) {
                error.textContent = "Please add at least one ingredient.";
                return;
            }

            const payload = {
                title: form.title.value,
                category: form.category.value,
                prepTime: form.prepTime.value,
                servings: form.servings.value,
                ingredients,
                directions: form.directions.value,
                notes: form.notes.value,
                contributor: form.contributor.value
            };

            try {
                // 🔌 BACKEND HOOK (replace URL)
                await fetch("https://your-api-endpoint/recipes", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(payload)
                });

                alert("Recipe submitted! 🎉");
                form.reset();
                preview.style.display = "none";
            } catch {
                error.textContent = "Something went wrong. Please try again.";
            }
        });
    </script>
</body>

</html>
