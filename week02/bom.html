<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Paul A. Scherbel">
    <meta name="description"
        content="This is an example of using java script to modify the DOM. It displays a top ten list of favorite Book of Mormon scriptures">
    <link rel="stylesheet" type="text/css" href="./styles/bom.css">
    <script src="./scripts/bom.js" defer></script>
    <title>WDD 131 - Book of Mormon Top 10</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Momo+Signature&display=swap" rel="stylesheet">
</head>
<body>
    <h1>📖 Book of Mormon - Top 10</h1>
    <main>
        <label for="favchap">Enter Book and Chapter: </label>
        <input type="text" id="favchap" placeholder="Alma 5">
        <button type="submit">Add Chapter</button>
        <button aria-label="Close" id="close-button"> ❌ </button>
        <ul id="list"></ul>
    </main>
</body>
</html>
