<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WDD 131 - Product Review Form</title>
    <meta name="description"
        content="An example of a responsive HTML form with a confirmation page.">
    <meta name="author" content="Paul A. Scherbel">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Baskervville:ital,wght@0,400..700;1,400..700&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" type="text/css" href="./styles/form.css">
    <script src="./scripts/form.js" defer></script>
    <link rel="icon" type="image/png" href="rainbow-compass.png">
</head>
<body>
    <header>
        <h1>Product Review</h1>
    </header>
    <main>
        
        <form method="get" action="review.html" class="wf1">
            <fieldset>

                <label for="product-selector">
                    Product Name
                    <select id="product-selector" name="product" required>
                        <option value="" disabled selected>Select a Product</option>
                    </select>
                </label>

                <label>Overall Rating</label>
                <div class="stars">
                    <input type="radio" id="fivestar" name="stars" value="5" required><label for="fivestar"></label>
                    <input type="radio" id="fourstar" name="stars" value="4" required><label for="fourstar"></label>
                    <input type="radio" id="threestar" name="stars" value="3" required><label for="threestar"></label>
                    <input type="radio" id="twostar" name="stars" value="2" required><label for="twostar"></label>
                    <input type="radio" id="onestar" name="stars" value="1" required><label for="onestar"></label>
                </div>
            
                <label for="date">Date of Installation:</label>
                <input type="date" id="date" name="completeDate">
              
                <div class="features">
                    <p>Which features did you find useful in the product? <br><span class="italics">(Click all that apply)</span></p>
            
                </div>

                <div class="checkbox">
                    <input type="checkbox" id="design-checkbox" name="design" value="yes">
                    <label for="design-checkbox">Design</label>
                    <input type="checkbox" id="durability-checkbox" name="durability" value="yes">
                    <label for="durability-checkbox">Durability</label>
                    <input type="checkbox" id="ease-checkbox" name="ease" value="yes">
                    <label for="ease-checkbox">Easy to Use</label>
                    <input type="checkbox" id="performance-checkbox" name="performance" value="yes">
                    <label for="performance-checkbox">Performance</label>
                </div>

                <div class="review">
                    <label for="review-text">Written Review: <span class="italics">(Optional)</span></label>
                    <textarea id="review-text" name="review" placeholder="Enter unlimited text here..."></textarea>
                </div>
                <div class="name">
                    <label for="name-input">Your Name: <span class="italics">(Optional)</span> </label>
                    <input type="text" id="name-input" name="name">
                </div>
            </fieldset>
            <input type="submit" value="Post Review">
        </form>

    </main>

    <footer>
        <p> ©️ <span id="currentYear"></span> 🌈 Paul A. Scherbel 🌈 Star Valley, Wyoming 🌈</p>
        <p>Last updated: <span id="lastModifiedDate"></span></p>
        <p><span class="label">Number of Visits: </span><span class="visits"></span></p>
    </footer>

</body>
</html>
